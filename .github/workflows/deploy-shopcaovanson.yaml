# Auto build + deploy shopcaovanson lên VPS K8s khi push lên main
# Monorepo: mã nguồn trong thư mục shopcaovanson/
name: Deploy shopcaovanson (main)

on:
  push:
    branches: [main]
    paths:
      - 'shopcaovanson/**'
      - '.github/workflows/deploy-shopcaovanson.yaml'
  workflow_dispatch:
    inputs:
      deploy_all:
        description: 'Build và deploy TẤT CẢ services (dùng lần đầu hoặc chạy thủ công)'
        type: boolean
        default: true

# Tránh 2 run song song push cùng tag :latest → lỗi "unknown blob" trên GHCR
concurrency:
  group: deploy-shopcaovanson-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    working-directory: shopcaovanson

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: ${{ vars.IMAGE_OWNER || github.repository_owner }}
  K8S_NAMESPACE: shop
  K8S_OVERLAY: ${{ vars.K8S_OVERLAY || 'dev' }}
  BUILDX_NO_DEFAULT_ATTESTATIONS: 1


permissions:
  contents: write
  packages: write

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      force_all: ${{ steps.force.outputs.all }}
      api-gateway: ${{ steps.force.outputs.all == 'true' && 'true' || steps.filter.outputs.api-gateway }}
      auth-service: ${{ steps.force.outputs.all == 'true' && 'true' || steps.filter.outputs.auth-service }}
      product-service: ${{ steps.force.outputs.all == 'true' && 'true' || steps.filter.outputs.product-service }}
      order-service: ${{ steps.force.outputs.all == 'true' && 'true' || steps.filter.outputs.order-service }}
      chat-service: ${{ steps.force.outputs.all == 'true' && 'true' || steps.filter.outputs.chat-service }}
      notification-service: ${{ steps.force.outputs.all == 'true' && 'true' || steps.filter.outputs.notification-service }}
      search-service: ${{ steps.force.outputs.all == 'true' && 'true' || steps.filter.outputs.search-service }}
      analytics-service: ${{ steps.force.outputs.all == 'true' && 'true' || steps.filter.outputs.analytics-service }}
      rasa-service: ${{ steps.force.outputs.all == 'true' && 'true' || steps.filter.outputs.rasa-service }}
      frontend: ${{ steps.force.outputs.all == 'true' && 'true' || steps.filter.outputs.frontend }}
      k8s-manifests: ${{ steps.filter.outputs.k8s-manifests }}
      services_list: ${{ steps.services.outputs.list }}
    steps:
      - uses: actions/checkout@v4

      - name: Deploy all services (manual hoặc tag [deploy-all] trong commit)
        id: force
        if: >
          (github.event_name == 'workflow_dispatch' && inputs.deploy_all) ||
          (github.event_name == 'push' && contains(github.event.head_commit.message, '[deploy-all]'))
        run: echo "all=true" >> "$GITHUB_OUTPUT"

      - name: Ghi chú khi không có service nào thay đổi
        if: steps.force.outputs.all != 'true'
        run: |
          echo "::notice::Chỉ chạy detect-changes — không có file service/frontend đổi trong commit này."
          echo "::notice::Để deploy tất cả: Actions → Run workflow, HOẶC push với commit message chứa [deploy-all]"

      - uses: dorny/paths-filter@v3
        id: filter
        if: steps.force.outputs.all != 'true'
        with:
          filters: |
            api-gateway:
              - 'shopcaovanson/services/api-gateway/**'
            auth-service:
              - 'shopcaovanson/services/auth-service/**'
              - 'shopcaovanson/pkg/**'
            product-service:
              - 'shopcaovanson/services/product-service/**'
              - 'shopcaovanson/pkg/**'
            order-service:
              - 'shopcaovanson/services/order-service/**'
              - 'shopcaovanson/pkg/**'
            chat-service:
              - 'shopcaovanson/services/chat-service/**'
            notification-service:
              - 'shopcaovanson/services/notification-service/**'
            search-service:
              - 'shopcaovanson/services/search-service/**'
            analytics-service:
              - 'shopcaovanson/services/analytics-service/**'
            rasa-service:
              - 'shopcaovanson/services/rasa-service/**'
            frontend:
              - 'shopcaovanson/frontend/web/**'
            k8s-manifests:
              - 'shopcaovanson/k8s/**'

      - name: Build services list for deploy
        id: services
        shell: bash
        run: |
          if [[ "${{ steps.force.outputs.all }}" == "true" ]]; then
            echo "list=api-gateway auth-service product-service order-service chat-service notification-service search-service analytics-service rasa-service frontend" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          list=""
          add() { if [[ "$1" == "true" ]]; then list="${list} $2"; fi; }
          add "${{ steps.filter.outputs.api-gateway }}" api-gateway
          add "${{ steps.filter.outputs.auth-service }}" auth-service
          add "${{ steps.filter.outputs.product-service }}" product-service
          add "${{ steps.filter.outputs.order-service }}" order-service
          add "${{ steps.filter.outputs.chat-service }}" chat-service
          add "${{ steps.filter.outputs.notification-service }}" notification-service
          add "${{ steps.filter.outputs.search-service }}" search-service
          add "${{ steps.filter.outputs.analytics-service }}" analytics-service
          add "${{ steps.filter.outputs.rasa-service }}" rasa-service
          add "${{ steps.filter.outputs.frontend }}" frontend
          echo "list=${list# }" >> "$GITHUB_OUTPUT"

  build-api-gateway:
    needs: detect-changes
    if: needs.detect-changes.outputs.api-gateway == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: shopcaovanson
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: shopcaovanson/services/api-gateway
          push: true
          provenance: false
          sbom: false
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/api-gateway:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/api-gateway:latest

  build-auth-service:
    needs: detect-changes
    if: needs.detect-changes.outputs.auth-service == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: shopcaovanson
          file: shopcaovanson/services/auth-service/Dockerfile
          push: true
          provenance: false
          sbom: false
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/auth-service:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/auth-service:latest

  build-product-service:
    needs: detect-changes
    if: needs.detect-changes.outputs.product-service == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: shopcaovanson
          file: shopcaovanson/services/product-service/Dockerfile
          push: true
          provenance: false
          sbom: false
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/product-service:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/product-service:latest

  build-order-service:
    needs: detect-changes
    if: needs.detect-changes.outputs.order-service == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: shopcaovanson
          file: shopcaovanson/services/order-service/Dockerfile
          push: true
          provenance: false
          sbom: false
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/order-service:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/order-service:latest

  build-chat-service:
    needs: detect-changes
    if: needs.detect-changes.outputs.chat-service == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: shopcaovanson
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: shopcaovanson/services/chat-service
          push: true
          provenance: false
          sbom: false
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/chat-service:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/chat-service:latest

  build-notification-service:
    needs: detect-changes
    if: needs.detect-changes.outputs.notification-service == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: shopcaovanson
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: shopcaovanson/services/notification-service
          push: true
          provenance: false
          sbom: false
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/notification-service:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/notification-service:latest

  build-search-service:
    needs: detect-changes
    if: needs.detect-changes.outputs.search-service == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: shopcaovanson
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: shopcaovanson/services/search-service
          push: true
          provenance: false
          sbom: false
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/search-service:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/search-service:latest

  build-analytics-service:
    needs: detect-changes
    if: needs.detect-changes.outputs.analytics-service == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: shopcaovanson
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: shopcaovanson/services/analytics-service
          push: true
          provenance: false
          sbom: false
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/analytics-service:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/analytics-service:latest

  build-rasa-service:
    needs: detect-changes
    if: needs.detect-changes.outputs.rasa-service == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: shopcaovanson
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: shopcaovanson/services/rasa-service
          push: true
          provenance: false
          sbom: false
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/rasa-service:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/rasa-service:latest

  build-frontend:
    needs: detect-changes
    if: needs.detect-changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: shopcaovanson/frontend/web
          push: true
          provenance: false
          sbom: false
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/frontend-web:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/frontend-web:latest

  deploy-k8s:
    needs:
      - detect-changes
      - build-api-gateway
      - build-auth-service
      - build-product-service
      - build-order-service
      - build-chat-service
      - build-notification-service
      - build-search-service
      - build-analytics-service
      - build-rasa-service
      - build-frontend
    if: |
      always() &&
      !cancelled() &&
      !failure() &&
      needs.detect-changes.outputs.services_list != ''
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: shopcaovanson
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-kubectl@v4
        with:
          version: v1.29.0

      - name: Configure kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG_DATA }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config
          # cicd-deployer chỉ có quyền namespace shop — không dùng cluster-info (cần kube-system)
          kubectl get deployments -n shop

      - name: Deploy to VPS (110.172.29.72)
        env:
          SHA: ${{ github.sha }}
          SERVICES: ${{ needs.detect-changes.outputs.services_list }}
          REGISTRY: ${{ env.REGISTRY }}
          IMAGE_OWNER: ${{ env.IMAGE_OWNER }}
          OVERLAY: ${{ env.K8S_OVERLAY }}
        run: |
          chmod +x scripts/ci-deploy.sh
          bash scripts/ci-deploy.sh

      - name: Verify health
        run: |
          chmod +x scripts/verify-app.sh
          API_URL=https://vocabee.cloud FRONTEND_URL=https://shopcaovanson.xyz \
            bash scripts/verify-app.sh || true
