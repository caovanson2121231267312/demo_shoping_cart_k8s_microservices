name: Build and push to GHCR
description: Build image, push SHA tag, then retag latest (avoids GHCR unknown blob)

inputs:
  context:
    required: true
    description: Docker build context
  file:
    required: false
    default: ''
    description: Optional Dockerfile path (relative to repo root)
  image:
    required: true
    description: Image name without registry/owner (e.g. auth-service)

runs:
  using: composite
  steps:
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build and push SHA tag
      id: build
      uses: nick-fields/retry@v3
      with:
        timeout_minutes: 45
        max_attempts: 3
        retry_wait_seconds: 45
        shell: bash
        command: |
          set -euo pipefail
          IMAGE="${{ inputs.image }}"
          SHA_TAG="${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/${IMAGE}:${{ github.sha }}"
          FILE_ARGS=()
          if [ -n "${{ inputs.file }}" ]; then
            FILE_ARGS=(--file "${{ inputs.file }}")
          fi
          docker buildx build \
            "${FILE_ARGS[@]}" \
            --tag "${SHA_TAG}" \
            --push \
            --provenance=false \
            --sbom=false \
            "${{ inputs.context }}"

    - name: Tag as latest (manifest only)
      uses: nick-fields/retry@v3
      with:
        timeout_minutes: 5
        max_attempts: 3
        retry_wait_seconds: 20
        shell: bash
        command: |
          set -euo pipefail
          IMAGE="${{ inputs.image }}"
          SHA_TAG="${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/${IMAGE}:${{ github.sha }}"
          LATEST_TAG="${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/${IMAGE}:latest"
          docker buildx imagetools create --tag "${LATEST_TAG}" "${SHA_TAG}"
