version: "3.8"

services:
  rasa:
    image: rasa/rasa:3.6.20-full
    volumes:
      - ./rasa:/app
    command: run --enable-api --cors "*" --debug
    ports:
      - "5005:5005"
    depends_on:
      - rasa-actions

  rasa-actions:
    build:
      context: ./actions
    volumes:
      - ./actions:/app/actions
    environment:
      PRODUCT_SERVICE_URL: http://host.docker.internal:8082
      ORDER_SERVICE_URL: http://host.docker.internal:8083
      API_GATEWAY_URL: http://host.docker.internal:8080
    ports:
      - "5055:5055"

  rasa-bridge:
    build:
      context: .
    ports:
      - "8090:8090"
    environment:
      PORT: "8090"
      USE_RASA: "true"
      RASA_URL: http://rasa:5005
      PRODUCT_SERVICE_URL: http://host.docker.internal:8082
      ORDER_SERVICE_URL: http://host.docker.internal:8083
      API_GATEWAY_URL: http://host.docker.internal:8080
    depends_on:
      - rasa
