<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <title>Xác nhận tài khoản</title>
</head>
<body style="font-family: Arial, sans-serif; color: #333; line-height: 1.6;">
  <div style="max-width: 560px; margin: 0 auto; padding: 24px;">
    <h2 style="color: #1565C0;">Xác nhận tài khoản Shop Cao Văn Sơn</h2>

    <p style="text-align: center; margin: 32px 0;">
      <a href="{{ verify_url }}" style="background: #1565C0; color: #fff; padding: 12px 24px; text-decoration: none; border-radius: 6px; display: inline-block;">

    <p style="font-size: 13px; color: #666;">Link hết hạn sau 24 giờ. Nếu bạn không đăng ký, hãy bỏ qua email này.</p>

  </div>
