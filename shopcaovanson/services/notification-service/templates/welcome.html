<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <title>Chào mừng đến Shop Cao Văn Sơn</title>
  <style>
    body { font-family: Arial, sans-serif; color: #333; }
    .container { max-width: 600px; margin: 0 auto; padding: 24px; }
    .header { background: #1565C0; color: #fff; padding: 16px; border-radius: 8px; }
    .btn { display: inline-block; margin-top: 16px; padding: 12px 24px; background: #F57C00; color: #fff; text-decoration: none; border-radius: 4px; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>Chào mừng, {{ full_name }}!</h1>
    </div>
    <p>Cảm ơn bạn đã đăng ký tài khoản tại Shop Cao Văn Sơn.</p>
    <p>Email đăng ký: <strong>{{ email }}</strong></p>
    <p>Khám phá hàng ngàn sản phẩm chất lượng với giá tốt nhất.</p>
    <a class="btn" href="https://shopcaovanson.xyz">Mua sắm ngay</a>
  </div>
</body>
</html>
