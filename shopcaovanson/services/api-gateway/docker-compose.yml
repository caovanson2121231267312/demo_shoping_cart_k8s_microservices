services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api-gateway:
    build: .
    ports:
      - "8080:8080"
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
    environment:
      REDIS_URL: redis://redis:6379/0
      AUTH_SERVICE_URL: http://host.docker.internal:8081
      PRODUCT_SERVICE_URL: http://host.docker.internal:8082
      ORDER_SERVICE_URL: http://host.docker.internal:8083
      CHAT_SERVICE_URL: http://host.docker.internal:8084
      PORT: "8080"
