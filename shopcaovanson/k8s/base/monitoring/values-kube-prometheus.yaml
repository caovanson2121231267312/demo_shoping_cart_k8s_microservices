# kube-prometheus-stack — tối ưu cho VPS single-node 16GB RAM
# Cài qua: bash scripts/install-monitoring.sh

alertmanager:
  enabled: false

grafana:
  enabled: true
  defaultDashboardsEnabled: true
  adminUser: admin
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 300m
      memory: 256Mi
  grafana.ini:
    server:
      root_url: https://monitor.shopcaovanson.xyz/
      serve_from_sub_path: false

prometheus:
  enabled: true
  prometheusSpec:
    retention: 3d
    retentionSize: 1GB
    scrapeInterval: 60s
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 400m
        memory: 640Mi
    storageSpec:
      volumeClaimTemplate:
        spec:
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 5Gi

prometheusOperator:
  resources:
    requests:
      cpu: 50m
      memory: 96Mi
    limits:
      cpu: 200m
      memory: 192Mi

kubeStateMetrics:
  enabled: true

nodeExporter:
  enabled: true
