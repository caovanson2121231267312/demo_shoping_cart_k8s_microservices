apiVersion: apps/v1
kind: Deployment
metadata:
  name: caro-service
  namespace: shop
  labels:
    app: caro-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: caro-service
  template:
    metadata:
      labels:
        app: caro-service
    spec:
      containers:
      - name: caro-service
        image: ghcr.io/caovanson/caro-service:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8087
          name: http
        envFrom:
        - configMapRef:
            name: caro-service-config
        - secretRef:
            name: caro-service-secret
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: caro-service-secret
              key: DATABASE_URL
        - name: JWT_PUBLIC_KEY
          valueFrom:
            secretKeyRef:
              name: caro-service-secret
              key: JWT_PUBLIC_KEY
        - name: TURN_CREDENTIAL
          valueFrom:
            secretKeyRef:
              name: caro-service-secret
              key: TURN_CREDENTIAL
              optional: true
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "256Mi"
            cpu: "400m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8087
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /health
            port: 8087
          initialDelaySeconds: 5
          periodSeconds: 10
