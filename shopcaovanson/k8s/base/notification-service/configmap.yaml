apiVersion: v1
kind: ConfigMap
metadata:
  name: notification-service-config
  namespace: shop
  labels:
    app: notification-service
data:
  APP_ENV: "production"
  PORT: "8000"
  LOG_LEVEL: "info"
  KAFKA_BROKERS: "kafka.infra.svc.cluster.local:9092"
  KAFKA_BOOTSTRAP_SERVERS: "kafka.infra.svc.cluster.local:9092"
  KAFKA_GROUP_ID: "notification-service"
  KAFKA_TOPIC_ORDER_CREATED: "order.created"
  KAFKA_TOPIC_USER_REGISTERED: "user.registered"
  SMTP_HOST: "smtp.gmail.com"
  SMTP_PORT: "587"
  SMTP_FROM: "noreply@shopcaovanson.xyz"
  SMTP_USE_TLS: "true"
