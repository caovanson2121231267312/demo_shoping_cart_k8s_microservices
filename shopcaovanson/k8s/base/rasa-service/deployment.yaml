apiVersion: apps/v1
kind: Deployment
metadata:
  name: rasa-service
  namespace: shop
  labels:
    app: rasa-service
spec:
  replicas: 1
  revisionHistoryLimit: 2
  progressDeadlineSeconds: 600
  selector:
    matchLabels:
      app: rasa-service
  template:
    metadata:
      labels:
        app: rasa-service
    spec:
      containers:
      - name: rasa-service
        image: ghcr.io/caovanson/rasa-service:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
          name: http
        envFrom:
        - configMapRef:
            name: rasa-service-config
        resources:
          requests:
            memory: "96Mi"
            cpu: "50m"
          limits:
            memory: "320Mi"
            cpu: "400m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 10
