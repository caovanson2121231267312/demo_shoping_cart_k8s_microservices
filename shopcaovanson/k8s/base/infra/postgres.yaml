apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: infra
  labels:
    app: postgres
spec:
  type: ClusterIP
  ports:
  - port: 5432
    targetPort: 5432
    name: postgres
  selector:
    app: postgres
  clusterIP: None
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: infra
  labels:
    app: postgres
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      volumes:
      - name: dshm
        emptyDir:
          medium: Memory
          sizeLimit: 512Mi
      - name: postgres-config
        configMap:
          name: postgres-config
      containers:
      - name: postgres
        image: postgres:15-alpine
        # Dùng args (không ghi đè command/entrypoint) — entrypoint sẽ drop root → user postgres.
        # Nếu dùng command: [postgres,...] thì process chạy root → CrashLoop:
        #   "root" execution of the PostgreSQL server is not permitted
        args:
        - -c
        - config_file=/etc/postgresql/postgresql.conf
        ports:
        - containerPort: 5432
          name: postgres
        env:
        - name: POSTGRES_USER
          value: shopcaovanson
        - name: POSTGRES_DB
          value: shopcaovanson
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: POSTGRES_PASSWORD
        # Create secret before deploy:
        # kubectl create secret generic postgres-secret -n infra \
        #   --from-literal=POSTGRES_PASSWORD='CHANGE_ME_STRONG_PASSWORD'
        volumeMounts:
        - name: postgres-data
          mountPath: /var/lib/postgresql/data
          subPath: pgdata
        - name: dshm
          mountPath: /dev/shm
        - name: postgres-config
          mountPath: /etc/postgresql
          readOnly: true
        resources:
          requests:
            memory: "1Gi"
            cpu: "500m"
          limits:
            memory: "4Gi"
            cpu: "2000m"
        livenessProbe:
          exec:
            command:
            - pg_isready
            - -U
            - shopcaovanson
            - -d
            - shopcaovanson
          initialDelaySeconds: 30
          periodSeconds: 15
        readinessProbe:
          exec:
            command:
            - pg_isready
            - -U
            - shopcaovanson
            - -d
            - shopcaovanson
          initialDelaySeconds: 10
          periodSeconds: 10
  volumeClaimTemplates:
  - metadata:
      name: postgres-data
    spec:
      accessModes: ["ReadWriteOnce"]
      resources:
        requests:
          # Do not change this on an existing cluster — StatefulSet forbids PVC template updates.
          # Expand PVC manually if needed: kubectl -n infra edit pvc postgres-data-postgres-0
          storage: 20Gi
