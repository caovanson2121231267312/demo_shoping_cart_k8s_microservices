apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: shop
  labels:
    app: auth-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
      - name: auth-service
        image: ghcr.io/caovanson/auth-service:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
          name: http
        envFrom:
        - configMapRef:
            name: auth-service-config
        - secretRef:
            name: auth-service-secret
        env:
        - name: REDIS_URL
          valueFrom:
            secretKeyRef:
              name: auth-service-secret
              key: REDIS_URL
        - name: JWT_PRIVATE_KEY
          valueFrom:
            secretKeyRef:
              name: auth-service-secret
              key: JWT_PRIVATE_KEY
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: auth-service-secret
              key: DB_PASSWORD
        - name: MINIO_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: auth-service-secret
              key: MINIO_ACCESS_KEY
              optional: true
        - name: MINIO_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: auth-service-secret
              key: MINIO_SECRET_KEY
              optional: true
        resources:
          requests:
            memory: "48Mi"
            cpu: "50m"
          limits:
            memory: "192Mi"
            cpu: "300m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 15
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
