name: Build and Deploy (main/prod)

on:
  push:
    branches: [main, prod]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: caovanson
  K8S_NAMESPACE: shop
  K8S_OVERLAY: prod

permissions:
  contents: write
  packages: write

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      api-gateway: ${{ steps.filter.outputs.api-gateway }}
      auth-service: ${{ steps.filter.outputs.auth-service }}
      product-service: ${{ steps.filter.outputs.product-service }}
      order-service: ${{ steps.filter.outputs.order-service }}
      chat-service: ${{ steps.filter.outputs.chat-service }}
      notification-service: ${{ steps.filter.outputs.notification-service }}
      search-service: ${{ steps.filter.outputs.search-service }}
      frontend: ${{ steps.filter.outputs.frontend }}
      k8s-manifests: ${{ steps.filter.outputs.k8s-manifests }}
      services_list: ${{ steps.services.outputs.list }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            api-gateway:
              - 'services/api-gateway/**'
            auth-service:
              - 'services/auth-service/**'
            product-service:
              - 'services/product-service/**'
            order-service:
              - 'services/order-service/**'
            chat-service:
              - 'services/chat-service/**'
            notification-service:
              - 'services/notification-service/**'
            search-service:
              - 'services/search-service/**'
            frontend:
              - 'frontend/web/**'
            k8s-manifests:
              - 'k8s/**'

      - name: Build services list for deploy
        id: services
        shell: bash
        run: |
          list=""
          add() { if [[ "$1" == "true" ]]; then list="${list} $2"; fi; }
          add "${{ steps.filter.outputs.api-gateway }}" api-gateway
          add "${{ steps.filter.outputs.auth-service }}" auth-service
          add "${{ steps.filter.outputs.product-service }}" product-service
          add "${{ steps.filter.outputs.order-service }}" order-service
          add "${{ steps.filter.outputs.chat-service }}" chat-service
          add "${{ steps.filter.outputs.notification-service }}" notification-service
          add "${{ steps.filter.outputs.search-service }}" search-service
          add "${{ steps.filter.outputs.frontend }}" frontend
          echo "list=${list# }" >> "$GITHUB_OUTPUT"

  build-api-gateway:
    needs: detect-changes
    if: needs.detect-changes.outputs.api-gateway == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: services/api-gateway
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/api-gateway:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/api-gateway:latest

  build-auth-service:
    needs: detect-changes
    if: needs.detect-changes.outputs.auth-service == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: services/auth-service
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/auth-service:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/auth-service:latest

  build-product-service:
    needs: detect-changes
    if: needs.detect-changes.outputs.product-service == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: services/product-service
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/product-service:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/product-service:latest

  build-order-service:
    needs: detect-changes
    if: needs.detect-changes.outputs.order-service == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: services/order-service
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/order-service:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/order-service:latest

  build-chat-service:
    needs: detect-changes
    if: needs.detect-changes.outputs.chat-service == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: services/chat-service
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/chat-service:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/chat-service:latest

  build-notification-service:
    needs: detect-changes
    if: needs.detect-changes.outputs.notification-service == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: services/notification-service
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/notification-service:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/notification-service:latest

  build-search-service:
    needs: detect-changes
    if: needs.detect-changes.outputs.search-service == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: services/search-service
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/search-service:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/search-service:latest

  build-frontend:
    needs: detect-changes
    if: needs.detect-changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: frontend/web
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/frontend-web:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/frontend-web:latest

  deploy-k8s:
    needs:
      - detect-changes
      - build-api-gateway
      - build-auth-service
      - build-product-service
      - build-order-service
      - build-chat-service
      - build-notification-service
      - build-search-service
      - build-frontend
    if: |
      always() &&
      !cancelled() &&
      !failure() &&
      (needs.detect-changes.outputs.services_list != '' ||
       needs.detect-changes.outputs.k8s-manifests == 'true')
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-kubectl@v4
        with:
          version: v1.29.0

      - name: Configure kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG_DATA }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config
          kubectl get deployments -n shop

      - name: Deploy to VPS cluster (110.172.29.72)
        env:
          SHA: ${{ github.sha }}
          SERVICES: ${{ needs.detect-changes.outputs.services_list }}
          APPLY_MANIFESTS: ${{ needs.detect-changes.outputs.k8s-manifests }}
        run: |
          chmod +x scripts/ci-deploy.sh
          bash scripts/ci-deploy.sh

      - name: Verify application health
        run: |
          chmod +x scripts/verify-app.sh
          API_URL=https://vocabee.cloud FRONTEND_URL=https://shopcaovanson.xyz \
            bash scripts/verify-app.sh || true

  update-manifests:
    needs:
      - detect-changes
      - deploy-k8s
    if: |
      success() &&
      needs.detect-changes.outputs.services_list != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update deployment image tags in git
        run: |
          SHA="${{ github.sha }}"
          update_image() {
            local svc="$1"
            local image="$2"
            local file="k8s/base/${svc}/deployment.yaml"
            if [[ -f "$file" ]]; then
              sed -i "s|image: ghcr.io/caovanson/${image}:.*|image: ghcr.io/caovanson/${image}:${SHA}|g" "$file"
            fi
          }

          [[ "${{ needs.detect-changes.outputs.api-gateway }}" == "true" ]] && update_image api-gateway api-gateway
          [[ "${{ needs.detect-changes.outputs.auth-service }}" == "true" ]] && update_image auth-service auth-service
          [[ "${{ needs.detect-changes.outputs.product-service }}" == "true" ]] && update_image product-service product-service
          [[ "${{ needs.detect-changes.outputs.order-service }}" == "true" ]] && update_image order-service order-service
          [[ "${{ needs.detect-changes.outputs.chat-service }}" == "true" ]] && update_image chat-service chat-service
          [[ "${{ needs.detect-changes.outputs.notification-service }}" == "true" ]] && update_image notification-service notification-service
          [[ "${{ needs.detect-changes.outputs.search-service }}" == "true" ]] && update_image search-service search-service
          [[ "${{ needs.detect-changes.outputs.frontend }}" == "true" ]] && update_image frontend frontend-web

      - name: Commit manifest sync
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "No manifest changes."
            exit 0
          fi
          git add k8s/base/*/deployment.yaml
          git commit -m "ci(prod): sync image tags to ${GITHUB_SHA}"
          git push
